name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Verify tag matches project version
        shell: bash
        run: |
          version=$(dotnet msbuild NexusOps.VoiceWorker.csproj -getProperty:Version | tail -n 1)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match v${version}"; exit 1; }
      - run: dotnet restore NexusOps.VoiceWorker.sln --configfile NuGet.Config
      - run: dotnet test NexusOps.VoiceWorker.sln --configuration Release --no-restore
        env:
          RUN_POSTGRES_INTEGRATION_TESTS: '1'
      - run: dotnet publish NexusOps.VoiceWorker.csproj --configuration Release --no-restore --output publish /p:UseAppHost=false
      - name: Package release
        run: tar -czf "NexusOps.VoiceWorker-${GITHUB_REF_NAME}.tar.gz" -C publish .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "NexusOps.VoiceWorker-${GITHUB_REF_NAME}.tar.gz" --generate-notes --prerelease
