<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">NexusOps tok platforme</title>
  <desc id="desc">Animirani prikaz toka od operativnog portala i Voice Command Centera kroz ASP.NET Core, PostgreSQL red, Twilio i OpenAI Realtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102747"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{fill:#f8fafc;font:700 20px system-ui,sans-serif}.detail{fill:#9fb3cc;font:14px system-ui,sans-serif}.eyebrow{fill:#67e8f9;font:700 13px system-ui,sans-serif;letter-spacing:2px}.card{fill:#101f36;stroke:#29496d;stroke-width:1.5}.flow{fill:none;stroke:url(#line);stroke-width:4;stroke-linecap:round;stroke-dasharray:10 14;animation:move 2.4s linear infinite}.pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d1{animation-delay:.55s}.d2{animation-delay:1.1s}.d3{animation-delay:1.65s}.dot{animation:blink 1.8s ease-in-out infinite}.dot2{animation-delay:.6s}.dot3{animation-delay:1.2s}@keyframes move{to{stroke-dashoffset:-48}}@keyframes pulse{0%,100%{opacity:.78;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.dot{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="180" fill="#8b5cf6" opacity=".06"/><circle cx="120" cy="420" r="210" fill="#38bdf8" opacity=".05"/>
  <text class="eyebrow" x="52" y="48">NEXUSOPS · OPERATIVNI TOK U STVARNOM VREMENU</text>
  <circle class="dot" cx="1070" cy="43" r="5" fill="#34d399" filter="url(#glow)"/><text class="detail" x="1084" y="48">LIVE</text>
  <path class="flow" d="M260 170H340M560 170H640M860 170H940"/>
  <path class="flow" d="M750 245V310H935"/>
  <g class="pulse">
    <rect class="card" x="40" y="98" width="220" height="145" rx="20"/><circle cx="78" cy="135" r="13" fill="#38bdf8" filter="url(#glow)"/>
    <text class="title" x="105" y="142">Operativni portal</text><text class="detail" x="68" y="180">Radni nalozi · Imovina</text><text class="detail" x="68" y="204">Zalihe · Financije · Tim</text>
  </g>
  <g class="pulse d1">
    <rect class="card" x="340" y="82" width="220" height="177" rx="20"/><circle cx="378" cy="121" r="13" fill="#8b5cf6" filter="url(#glow)"/>
    <text class="title" x="405" y="128">ASP.NET Core</text><text class="detail" x="368" y="166">Tenant i role zaštita</text><text class="detail" x="368" y="190">REST · WebSocket · Health</text><text class="detail" x="368" y="214">Rate limits · Correlation ID</text>
  </g>
  <g class="pulse d2">
    <rect class="card" x="640" y="98" width="220" height="145" rx="20"/><circle cx="678" cy="135" r="13" fill="#f59e0b" filter="url(#glow)"/>
    <text class="title" x="705" y="142">PostgreSQL red</text><text class="detail" x="668" y="180">SKIP LOCKED · Lease</text><text class="detail" x="668" y="204">Retry · Dead letter</text>
  </g>
  <g class="pulse d3">
    <rect class="card" x="940" y="82" width="220" height="177" rx="20"/><circle cx="978" cy="121" r="13" fill="#34d399" filter="url(#glow)"/>
    <text class="title" x="1005" y="128">Voice AI</text><text class="detail" x="968" y="166">Twilio poziv i callback</text><text class="detail" x="968" y="190">Media Stream WebSocket</text><text class="detail" x="968" y="214">OpenAI Realtime audio</text>
  </g>
  <g>
    <rect x="260" y="310" width="675" height="72" rx="18" fill="#0c192c" stroke="#284567"/>
    <circle class="dot" cx="300" cy="346" r="6" fill="#38bdf8"/><circle class="dot dot2" cx="324" cy="346" r="6" fill="#8b5cf6"/><circle class="dot dot3" cx="348" cy="346" r="6" fill="#34d399"/>
    <text class="title" x="382" y="343">OpenTelemetry</text><text class="detail" x="382" y="365">traces · metrics · HTTP resilience · OTLP export</text>
  </g>
  <text x="600" y="412" text-anchor="middle" fill="#6f88a7" font-family="system-ui,sans-serif" font-size="13">Docker · Railway · GitHub Actions · CodeQL · Testcontainers</text>
</svg>
